name: Validate website

on:
  push:
    branches:
      - maintenance-security-2026-10
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Generate current npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Save lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: updated-package-lock
          path: package-lock.json
          retention-days: 7

      - name: Commit lockfile back to maintenance branch
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Lock updated website dependencies'
            git push origin HEAD:maintenance-security-2026-10
          fi

      - name: Clean install
        run: npm ci --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Security audit (high and critical vulnerabilities)
        run: npm audit --audit-level=high --omit=optional
